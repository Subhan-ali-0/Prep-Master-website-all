<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prep Master</title>

  <link rel="stylesheet" href="/css/app.css" />
</head>

<body>

  <!-- SPLASH -->
  <div id="splash" class="splash">
    <img src="/assets/logo.png" alt="Prep Master" />
    <div>Prep Master</div>
  </div>

  <!-- DRAWER SHADE -->
  <div id="drawerShade" class="drawer-shade"></div>

  <!-- SIDE DRAWER -->
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <div class="drawer-brand">
        <img src="/assets/logo.png" alt="Prep Master" />
        <strong>Prep Master</strong>
      </div>

      <button id="drawerClose" class="icon-btn">×</button>
    </div>

    <button class="drawer-item" data-section="appsSection">
      <span>⌂</span>
      <span>Explore Apps</span>
    </button>

    <button class="drawer-item" data-section="myAppsSection">
      <span>▣</span>
      <span>My Apps</span>
    </button>

    <a
      class="drawer-item"
      href="https://t.me/prepmaster0"
      target="_blank"
    >
      <span>➤</span>
      <span>Telegram Channel</span>
    </a>

    <button id="drawerTheme" class="drawer-item">
      <span>◐</span>
      <span>Light / Dark Mode</span>
    </button>
  </aside>


  <!-- HEADER -->
  <header class="topbar">

    <button id="menuBtn" class="header-icon">
      ☰
    </button>

    <div class="brand">

      <img
        class="brand-logo"
        src="/assets/logo.png"
        alt="Prep Master Logo"
      />

      <div class="brand-text">
        <div class="brand-name">
          Prep <span>Master</span>
        </div>

        <div class="brand-tagline">
          Study • Prepare • Succeed
        </div>
      </div>

    </div>

    <div class="header-actions">

      <button id="notificationBtn" class="header-action">
        ♧
      </button>

      <button id="themeToggle" class="header-action">
        ☾
      </button>

      <button id="accountBtn" class="account-btn">
        <span>♙</span>
        <span>Account</span>
      </button>

    </div>

  </header>


  <!-- MAIN -->
  <main class="container">

    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <div class="hero-small">
          Welcome to
        </div>

        <h1>
          Prep <span>Master</span>
        </h1>

        <p>
          Your Study Companion<br />
          for a Better Tomorrow
        </p>

      </div>

      <div class="hero-art">
        <div class="books">
          🎓
        </div>
      </div>

    </section>


    <!-- SEARCH -->
    <div class="search-box">

      <span class="search-icon">⌕</span>

      <input
        id="searchInput"
        type="search"
        placeholder="Search apps, batches or platforms..."
        autocomplete="off"
      />

      <button id="clearSearch" class="clear-search">
        ×
      </button>

    </div>


    <!-- TABS -->
    <div class="tabs">

      <button
        id="appsTab"
        class="tab active"
        data-tab="apps"
      >
        Apps
      </button>

      <button
        id="myAppsTab"
        class="tab"
        data-tab="myapps"
      >
        My Apps
      </button>

    </div>


    <!-- APPS -->
    <section id="appsSection" class="apps-section">

      <div class="section-heading">
        Popular Apps
      </div>

      <div id="appsCount" class="apps-count">
        0 Apps
      </div>

      <div id="appsGrid" class="apps-list">
        <!-- Apps loaded by app.js -->
      </div>

    </section>


    <!-- MY APPS -->
    <section
      id="myAppsSection"
      class="apps-section hidden"
    >

      <div class="section-heading">
        My Apps
      </div>

      <div id="myAppsGrid" class="apps-list">
        <!-- My apps loaded by app.js -->
      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button
      class="bottom-item active"
      data-section="home"
    >
      <span class="bottom-icon">⌂</span>
      <span>Home</span>
    </button>

    <button
      class="bottom-item"
      data-section="appsSection"
    >
      <span class="bottom-icon">◈</span>
      <span>Explore</span>
    </button>

    <a
      class="bottom-item"
      href="https://t.me/prepmaster0"
      target="_blank"
    >
      <span class="bottom-icon">➤</span>
      <span>Telegram</span>
    </a>

    <button
      id="bottomAccount"
      class="bottom-item"
    >
      <span class="bottom-icon">♙</span>
      <span>Account</span>
    </button>

  </nav>


  <!-- APP DETAIL MODAL -->
  <div id="appModal" class="modal hidden">

    <div class="modal-box">

      <button
        id="closeAppModal"
        class="modal-close"
      >
        ×
      </button>

      <div class="app-detail-logo-wrap">
        <img
          id="detailAppLogo"
          class="detail-app-logo"
          src="/assets/logo.png"
          alt=""
        />
      </div>

      <h2 id="detailAppName">
        App
      </h2>

      <p id="detailAppDescription">
        Unlock this app with your App Key.
      </p>

      <div class="key-box">

        <input
          id="appKeyInput"
          type="text"
          placeholder="Enter App Key"
          autocomplete="off"
        />

        <button id="verifyKeyBtn">
          Verify App Key
        </button>

      </div>

      <button
        id="purchaseVideoBtn"
        class="purchase-btn hidden"
      >
        How to Purchase Premium?
      </button>

    </div>

  </div>


  <!-- NOTIFICATIONS -->
  <div id="notificationModal" class="modal hidden">

    <div class="modal-box">

      <button
        id="closeNotificationModal"
        class="modal-close"
      >
        ×
      </button>

      <h2>Notifications</h2>

      <div id="notificationsList">
        <p>No notifications yet.</p>
      </div>

    </div>

  </div>


  <!-- ACCOUNT -->
  <div id="accountModal" class="modal hidden">

    <div class="modal-box account-modal">

      <button
        id="closeAccountModal"
        class="modal-close"
      >
        ×
      </button>

      <div id="accountLoggedOut">

        <h2>Account</h2>

        <input
          id="usernameInput"
          type="text"
          placeholder="Username"
        />

        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
        />

        <button id="loginBtn">
          Login
        </button>

        <button id="registerBtn" class="secondary-btn">
          Create Account
        </button>

      </div>


      <div id="accountLoggedIn" class="hidden">

        <h2>My Account</h2>

        <p id="accountUsername"></p>

        <button id="logoutBtn" class="secondary-btn">
          Logout
        </button>

      </div>

    </div>

  </div>


  <!-- TOAST -->
  <div id="toast" class="toast"></div>


  <script src="/js/app.js"></script>

</body>
</html>
