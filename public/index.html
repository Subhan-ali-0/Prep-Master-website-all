<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Prep Master</title>

  <link
    rel="stylesheet"
    href="/css/app.css"
  >
</head>

<body>

  <!-- SPLASH -->
  <div id="splash" class="splash">
    <img
      src="/assets/logo.png"
      alt="Prep Master"
    >

    <strong>
      Prep Master
    </strong>
  </div>


  <!-- HEADER -->
  <header class="topbar">

    <div class="brand">

      <img
        src="/assets/logo.png"
        alt="Prep Master"
      >

      <span>
        Prep Master
      </span>

    </div>


    <!-- THREE DOTS -->
    <button
      id="menuBtn"
      class="menu-btn"
      aria-label="Menu"
    >
      ⋮
    </button>

  </header>


  <!-- MENU -->
  <aside
    id="drawer"
    class="drawer"
  >

    <div class="drawer-head">

      <strong>
        Menu
      </strong>

      <button
        id="closeMenu"
        class="close-menu"
      >
        ×
      </button>

    </div>


    <!-- 1. APPS -->
    <button
      class="menu-item active"
      data-view="explore"
    >
      <span class="menu-number">
        1
      </span>

      <span>
        Apps
      </span>
    </button>


    <!-- 2. MY APPS -->
    <button
      class="menu-item"
      data-view="myapps"
    >
      <span class="menu-number">
        2
      </span>

      <span>
        My Apps
      </span>
    </button>


    <!-- 3. TELEGRAM -->
    <a
      class="menu-item"
      href="https://t.me/prepmaster0"
      target="_blank"
      rel="noopener"
    >
      <span class="menu-number">
        3
      </span>

      <span>
        Join Telegram
      </span>
    </a>


    <!-- 4. ACCOUNT -->
    <button
      id="accountBtn"
      class="menu-item"
    >
      <span class="menu-number">
        4
      </span>

      <span>
        Account
      </span>
    </button>

  </aside>


  <div
    id="shade"
    class="shade"
  ></div>


  <!-- MAIN -->
  <main>

    <!-- WELCOME -->
    <section class="welcome">

      <div>

        <span class="welcome-small">
          WELCOME TO
        </span>

        <h1>
          Prep Master
        </h1>

        <p>
          Your study partner for a better tomorrow.
        </p>

      </div>

    </section>


    <!-- SEARCH -->
    <div class="search-box">

      <span>
        🔍
      </span>

      <input
        id="search"
        type="search"
        placeholder="Search apps..."
      >

    </div>


    <!-- APP SECTION -->
    <section class="apps-section">

      <div class="section-title">

        <h2 id="viewTitle">
          Apps
        </h2>

        <span id="appCount"></span>

      </div>


      <div
        id="appsGrid"
        class="grid"
      ></div>


      <div
        id="empty"
        class="empty hidden"
      >
        No apps found.
      </div>

    </section>

  </main>


  <!-- NOTIFICATION MODAL -->
  <div
    id="noticeModal"
    class="modal"
  >

    <div class="modal-card">

      <button
        class="x"
        data-close="noticeModal"
      >
        ×
      </button>

      <h3>
        Notifications
      </h3>

      <div id="notifications"></div>

    </div>

  </div>


  <!-- APP MODAL -->
  <div
    id="appModal"
    class="modal"
  >

    <div class="modal-card app-modal">

      <button
        class="x"
        data-close="appModal"
      >
        ×
      </button>

      <img
        id="detailLogo"
        class="detail-logo"
        src="/assets/logo.png"
        alt=""
      >

      <h3 id="detailName"></h3>

      <p id="detailDesc"></p>


      <label>
        App Key
      </label>

      <input
        id="keyInput"
        placeholder="Enter your app key"
      >


      <button
        id="verifyBtn"
        class="primary"
      >
        Verify App Key
      </button>


      <a
        id="purchaseVideo"
        class="secondary hidden"
        target="_blank"
        rel="noopener"
      >
        How to Purchase Premium?
      </a>


      <p
        id="keyStatus"
        class="status"
      ></p>

    </div>

  </div>


  <!-- ACCOUNT MODAL -->
  <div
    id="accountModal"
    class="modal"
  >

    <div class="modal-card">

      <button
        class="x"
        data-close="accountModal"
      >
        ×
      </button>

      <h3>
        Account
      </h3>


      <div id="accountLoggedOut">

        <input
          id="username"
          placeholder="Username"
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
        >

        <div class="row">

          <button
            id="loginBtn"
            class="primary"
          >
            Login
          </button>

          <button
            id="registerBtn"
            class="secondary"
          >
            Create Account
          </button>

        </div>

      </div>


      <div
        id="accountLoggedIn"
        class="hidden"
      >

        <p id="accountInfo"></p>

        <button
          id="logoutBtn"
          class="secondary"
        >
          Logout
        </button>

      </div>


      <p
        id="accountStatus"
        class="status"
      ></p>

    </div>

  </div>


  <script src="/js/app.js"></script>

</body>
</html>
